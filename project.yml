name: Pennyworth
options:
  bundleIdPrefix: com.local
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "26.0"
  groupSortPosition: top
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: 1.10.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    Debug:
      SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
      ENABLE_TESTABILITY: YES
    Release:
      SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
targets:
  Pennyworth:
    type: application
    platform: macOS
    sources:
      - Pennyworth
    dependencies:
      - package: KeyboardShortcuts
    info:
      path: Pennyworth/Resources/Info.plist
      properties:
        CFBundleDisplayName: Pennyworth
        CFBundleName: Pennyworth
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "26.0"
        LSUIElement: true
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_NAME: Pennyworth
        PRODUCT_BUNDLE_IDENTIFIER: com.local.pennyworth
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        COMBINE_HIDPI_IMAGES: YES
  PennyworthTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - PennyworthTests
    dependencies:
      - target: Pennyworth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.pennyworth.tests
        GENERATE_INFOPLIST_FILE: YES
  PennyworthUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - PennyworthUITests
    dependencies:
      - target: Pennyworth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.pennyworth.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Pennyworth:
    build:
      targets:
        Pennyworth: all
        PennyworthTests: [test]
        PennyworthUITests: [test]
    test:
      targets:
        - PennyworthTests